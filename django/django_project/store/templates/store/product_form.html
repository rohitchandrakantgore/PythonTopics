{% load static %}
<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Add Product</title>
	<link rel="stylesheet" href="{% static 'store/store.css' %}">
</head>
<body>
	<header class="topbar">
		<a class="brand" href="{% url 'product-catalog' %}">STORE<span>CATALOG</span></a>
		<a class="admin-link" href="/admin/">Admin</a>
	</header>

	<main class="catalog">
		<section class="page-heading">
			<div>
				<p class="eyebrow">PRODUCTS</p>
				<h1>Add product</h1>
			</div>
		</section>

		<form class="product-form" method="post">
			{% csrf_token %}
			{% for field in form %}
				<div class="form-field">
					{{ field.label_tag }}
					{{ field }}
					{% for error in field.errors %}
						<p class="form-error">{{ error }}</p>
					{% endfor %}
				</div>
			{% endfor %}
			{% for error in form.non_field_errors %}
				<p class="form-error">{{ error }}</p>
			{% endfor %}
			<div class="form-actions">
				<a class="cancel-link" href="{% url 'product-catalog' %}">Cancel</a>
				<button class="submit-button" type="submit">Create product</button>
			</div>
		</form>
	</main>
</body>
</html>
